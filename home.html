<script>

	const pullToRefresh = document.querySelector('.pull-to-refresh');
	let touchstartY = 0;
	document.addEventListener('touchstart', e => {
	touchstartY = e.touches[0].clientY;
	});
	document.addEventListener('touchmove', e => {
	const touchY = e.touches[0].clientY;
	const touchDiff = touchY - touchstartY;
	if (touchDiff > 0 && window.scrollY === 0) {
		pullToRefresh.classList.add('seen');
		e.preventDefault();
	}
	});
	document.addEventListener('touchend', e => {
	if (pullToRefresh.classList.contains('seen')) {
		pullToRefresh.classList.remove('seen');
		location.reload();
	}
	});

</script>

<script>
	function toggleLike() {
		let heart = document.getElementById("heartIcon");

		if (heart.classList.contains("fa-regular")) {
			heart.classList.remove("fa-regular");
			heart.classList.add("fa-solid");
		} else {
			heart.classList.remove("fa-solid");
			heart.classList.add("fa-regular");
		}
	}
</script>

<script>
	function toggleSave() {
		let save = document.getElementById("saveIcon");

		if (save.classList.contains("fa-regular")) {
			save.classList.remove("fa-regular");
			save.classList.add("fa-solid");
		} else {
			save.classList.remove("fa-solid");
			save.classList.add("fa-regular");
		}
	}
</script>
