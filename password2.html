<!DOCTYPE html>
<html>
<head>
  	<meta charset="utf-8">
  	<meta name="viewport" content="initial-scale=1, width=device-width">
  	<link rel="stylesheet" href="./password2.css" />
  	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
integrity="sha512-
SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3
W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<body>
  	<div class="password">
    		<div class="password-inner">
      			<div class="group-child"></div>
    		</div>
    		<button class="back-btn" onclick="goBack()">
    			<i class="fa-solid fa-chevron-left"></i>
    				<span class="backreg">Regresar</span>
			</button>

    		<div class="group-parent">
                
      			<b class="ingresa-tu-nueva">Ingresa tu nueva contraseña</b>
      			<div class="tu-nueva-contrasea">Tu nueva contraseña debe ser diferente a tu contraseña anterior.</div>
      			
                <div class="input-container">
    				<i class="fa-solid fa-lock icon-left"></i>
    					<input type="password" id="password" placeholder="Contraseña nueva">
    						<i class="fa-regular fa-eye-slash icon-right" id="toggleIcon" onclick="toggleIcon()"></i>
				</div>

				<div class="input-container">
    				<i class="fa-solid fa-lock icon-left"></i>
    					<input type="password" id="password" placeholder="Confirmar contraseña">
    						<i class="fa-regular fa-eye-slash icon-right" id="toggleIcon" onclick="toggleIcon()"></i>
				</div>

				<button class="reestablecer-btn" onclick="mostrarModalConf()">
        				<b>Reestablecer contraseña</b>
      			</button>
    		</div>

			<div class="modal-conf" id="modalConf">
            <div class="modal-2">
                <div class="cardconf"></div>
                <img class="imagen-icon" alt="Icono confirmación" src="check2.svg">
                <img class="circulo" alt="Círculo decorativo" src="circulo.svg">
                
                <div class="contraseñare">¡Contraseña restablecida con<br> éxito!</div>
                <div class="tu-contrasea-ha-container">
                        <span class="tu-contrasea-ha">Tu contraseña ha sido restablecida <br></span>
                        <b>exitosamente.<br><br></b>
                        <span class="tu-contrasea-ha">Ya puedes iniciar sesión con tu <br>nueva contraseña.</span>
                </div>

                <button class="salir-btn" id="btnCerrarConfX" aria-label="Cerrar con X">
                        <div class="salir2"></div>
                        <img class="salir" alt="" src="salir.svg">
                </button>

                <button class="iniciar-btn" id="btnIniciarConf" type="button" onclick="iniciarSesion()">
                    Iniciar sesión
                </button>
            </div>
    </div>
            
  	</div>

<script>
    function goBack() {
        document.location = "password1.html";
    }
</script>

<!---Toggle icon-->
    <script>

        function toggleIcon(){

            var x = document.getElementById("password");

            if (x.type === "password"){
                x.type = "text";
            }else{
                x.type = "password";
            }

            var y = document.getElementById("toggleIcon");
            y.classList.toggle("fa-eye");
        }

    </script>

	<script>
function mostrarModalConf() {

    modalConf.style.display = 'block';

    setTimeout(() => {
        modalConf.style.opacity = '1';
        document.querySelector('#modalConf .modal-2').style.transform = 'scale(1)';
    }, 10);

	}

	function ocultarModalConf() {

    modalConf.style.opacity = '0';
    document.querySelector('#modalConf .modal-2').style.transform = 'scale(.95)';

    setTimeout(() => {
        modalConf.style.display = 'none';
    }, 200);

	}
        btnCerrarConfX.addEventListener('click', ocultarModalConf);
        btnIniciarConf.addEventListener('click', function(){
			document.location = "login.html"
		});

</script>


</body>
</html>
