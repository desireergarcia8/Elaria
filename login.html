<body>
  	
  	<div class="log-in">
    		<div class="log-in-inner">
      			<div class="group-child">
      			</div>
    		</div>

	<button class="back-btn" onclick="goBack()">
    		<i class="fa-solid fa-chevron-left"></i>
    			<span class="backreg">Regresar</span>
		</button>
	
	<b class="inicia-sesin">Inicia Sesión</b>

	<div class="input-container">
    	<i class="fa-solid fa-at icon-left"></i>
    		<input type="text" placeholder="Nombre de usuario">
	</div>

	<div class="input-container">
    	<i class="fa-solid fa-lock icon-left"></i>
    		<input type="password" id="password" placeholder="Contraseña">
    			<i class="fa-regular fa-eye-slash icon-right" id="toggleIcon" onclick="toggleIcon()"></i>
	</div>

	<div class="checkbox-container" onclick="toggleCheck()">
    	<i class="fa-regular fa-square" id="checkIcon"></i>
   		 <span>Recuérdame</span>
	</div>

	<button class="olvidaste-tu-contrasea" onclick="contraolv()">Olvidaste tu contraseña?</button>

	<button class="iniciar-sesion-btn" onclick="cuenta()">
                 <b>Iniciar Sesión</b>
            </button>

    		<div class="o-ingresa-con-parent">
      			<div class="o-ingresa-con">o ingresa con</div>
      			<img class="group-inner" alt="" src="facebook.png">
      			
      			<img class="ellipse-icon" alt="" src="google.png">
      			
      			<img class="group-child2" alt="" src="apple.svg">
      			
      			<div class="no-tienes-una-cuenta-parent">
                   <div class="no-tienes-una">¿No tienes una cuenta?</div>
                   <button class="crea-cuenta-inline-btn" onclick="crearCuenta()">Crea tu cuenta</button>
                </div>

      			<div class="line-div">
      			</div>
      			<div class="group-child3">
      			</div>
    		</div>
      			
    		</div>
    	
    		
  	</div>
  	
  	
<script>
    function goBack() {
        document.location = "welcome.html";
    }
</script>

<!---Toggle icon-->
    <script>

        function toggleIcon(){

            var x = document.getElementById("password");

            if (x.type === "password"){
                x.type = "text";
            }else{
                x.type = "password";
            }

            var y = document.getElementById("toggleIcon");
            y.classList.toggle("fa-eye");
        }

    </script>

	<script>
function toggleCheck() {
    let icon = document.getElementById("checkIcon");

    if (icon.classList.contains("fa-square")) {
        icon.classList.remove("fa-square");
        icon.classList.add("fa-square-check");
    } else {
        icon.classList.remove("fa-square-check");
        icon.classList.add("fa-square");
    }
}
</script>

<script>
		function cuenta(){
			document.location = "home.html";
		}

		function contraolv(){
			document.location = "password1.html";
		}

		function crearCuenta(){
			document.location = "crearcuenta.html"
		}
</script>
