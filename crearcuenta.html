<!DOCTYPE html>
<html>
<head>
  	<meta charset="utf-8">
  	<meta name="viewport" content="initial-scale=1, width=device-width">
  	<link rel="stylesheet"  href="./crearcuenta.css" />
  	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" />
  	<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
integrity="sha512-
SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3
W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  	
  	
</head>
<body>
  	
  	<div class="registro">
    		<div class="registro-inner">
      			<div class="group-child">
      			</div>
    		</div>

    	<b class="crea-tu-cuenta">Crea tu cuenta</b>
    		
		<button class="back-btn" onclick="goBack()">
    		<i class="fa-solid fa-chevron-left"></i>
    			<span class="backreg">Regresar</span>
		</button>

	<div class="input-container">
    	<i class="fa-solid fa-user icon-left"></i>
    		<input type="text" placeholder="Nombre completo">
	</div>

	<div class="input-container">
    	<i class="fa-solid fa-envelope icon-left"></i>
    		<input type="email" placeholder="Correo electrónico">
	</div>

	<div class="input-container">
    	<i class="fa-solid fa-at icon-left"></i>
    		<input type="text" placeholder="Nombre de usuario">
	</div>

	<div class="input-container">
    	<i class="fa-solid fa-lock icon-left"></i>
    		<input type="password" id="password" placeholder="Contraseña">
    			<i class="fa-regular fa-eye-slash icon-right" id="toggleIcon" onclick="toggleIcon()"></i>
	</div>

	<div class="checkbox-container" onclick="toggleCheck()">
    	<i class="fa-regular fa-square" id="checkIcon"></i>
   		 <span>Acepto Términos y Condiciones</span>
	</div>

	<button class="crear-cuenta-btn" onclick="cuenta()">
        <b>Crear cuenta</b>
        </button>

    		<div class="o-ingresa-con">o ingresa con</div>
    		<img class="facebook-icon" alt="" src="facebook.svg">
    		
    		<img class="google-icon" alt="" src="google.svg">
    		
    		<img class="apple-icon" alt="" src="apple.svg">
    		
    		<div class="ya-tienes-una-cuenta-parent">
               <span class="ya-tienes-una">¿Ya tienes una cuenta?</span>
               <button class="iniciar-sesion-inline-btn" onclick="iniciarSesion()">Iniciar Sesión</button>
            </div>

    		<div class="registro-child">
    		</div>
    		<div class="registro-item">
    		</div>
    		
  	</div>
  	
  	
<script>
    function goBack() {
        document.location = "welcome.html";
    }
</script>

<!---Toggle icon-->
    <script>

        function toggleIcon(){

            var x = document.getElementById("password");

            if (x.type === "password"){
                x.type = "text";
            }else{
                x.type = "password";
            }

            var y = document.getElementById("toggleIcon");
            y.classList.toggle("fa-eye");
        }

    </script>

	<script>
function toggleCheck() {
    let icon = document.getElementById("checkIcon");

    if (icon.classList.contains("fa-square")) {
        icon.classList.remove("fa-square");
        icon.classList.add("fa-square-check");
    } else {
        icon.classList.remove("fa-square-check");
        icon.classList.add("fa-square");
    }
}
</script>

<script>
		function cuenta(){
			document.location = "home.html";
		}

		function iniciarSesion(){
			document.location = "login.html"
		}
</script>
  	
</body>
</html>
