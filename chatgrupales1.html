<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <link rel="stylesheet" href="./chatgrupales2.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" />
</head>
<body>
    
    <div class="chat-grupales">
        <div class="chat-grupales-child"></div>
        <b class="mensajes">Mensajes</b>

        <div class="tab">
    <button class="tablinks active"
            onclick="mostrarGrupos(event)">
        Grupos
    </button>

    <button class="tablinks"
            onclick="mostrarMensajes(event)">
        Mensajes
    </button>
        </div>
        
        <div id="grupos">
            <button class="card1" id="cardDealBtn" aria-label="Abrir grupo The Deal" onclick="abrir()">
            <div class="card">
                <div class="card-child"></div>
            </div>
            <img class="thedeal-icon" alt="" src="thedeal.png">
            
            <div class="barprocess">
                <div class="barprocess-child"></div>
                <div class="frame"></div>
                <div class="rectangle-parent">
                    <div class="group-child"></div>
                    <div class="frame2"></div>
                </div>
            </div>
            <div class="leyendo">
                <div class="leyendo-child"></div>
                <div class="frame3"></div>
                <div class="leyendo2">6 leyendo</div>
                <img class="personas2-icon" alt="" src="personas2.svg">
            </div>
            <b class="the-deal">THE DEAL</b>
            <div class="elle-kennedy">Elle Kennedy • Cap 15 de 352</div>
        </button>
        
        
        <button class="card2" id="cardMistakeBtn" aria-label="Abrir grupo The Mistake">
            <div class="card">
                <div class="card-child"></div>
            </div>
            <div class="barprocess">
                <div class="barprocess-child"></div>
                <div class="frame"></div>
                <div class="rectangle-parent">
                    <div class="group-child"></div>
                    <div class="frame2"></div>
                </div>
            </div>
            <div class="leyendo">
                <div class="leyendo-child"></div>
                <div class="frame3"></div>
                <div class="leyendo2">34 leyendo</div>
                <img class="personas2-icon" alt="" src="personas2.svg">
            </div>
            <b class="the-deal">THE MISTAKE</b>
            <div class="elle-kennedy">Elle Kennedy • Cap 73 de 400</div>
            <div class="themistake">
                <img class="themistake-icon" alt="" src="themistake.png">
            </div>
        </button>
        
        <img class="puntos-icon" alt="" src="3puntos.svg">
        <img class="puntos-icon2" alt="" src="3puntos.svg">
        </div>

        <div id="mensajesTab">

    <button class="chat-card">
        <img src="imgperfil.svg" class="chat-img">
        <div class="chat-info">
            <div class="chat-header">
                <b>Sofía Bautista</b>
                <span>9:32 PM</span>
            </div>
            <div class="chat-preview">
                ¿Ya terminaste el capítulo 15?
            </div>
        </div>
    </button>


    <button class="chat-card chat-card2">
        <img src="imgperfil2.svg" class="chat-img">

        <div class="chat-info">
            <div class="chat-header">
                <b>Camila Ewens</b>
                <span>8:15 PM</span>
            </div>

            <div class="chat-preview">
                Te envié una recomendación 📚
            </div>
        </div>
    </button>
</div>
        
       
        <div class="nav-bar">
            <button class="nav-btn" id="navHomeBtn" aria-label="Inicio" onclick="home()">
                <img class="home-icon" alt="" src="homenormal.svg">
            </button>
            <button class="nav-btn" id="navSearchBtn" aria-label="Buscar">
                <img class="home-icon" alt="" src="search.svg">
            </button>
            <button class="nav-btn" id="navNotificationsBtn" aria-label="Notificaciones">
                <img class="home-icon" alt="" src="notifications.svg">
            </button>
            <button class="nav-btn" id="navSmsBtn" aria-label="Mensajes">
                <img class="home-icon" alt="" src="smsfill.svg">
            </button>
        </div>
        
        <img class="hamburguer-icon" alt="" src="hamburguer.svg">
        <!--<img class="sms2-icon" alt="" src="sms2.svg">-->
    </div>

<script>
    function home(){
        document.location = "home.html"
    }

    function abrir(){
        document.location = "chat1.2.html"
    }
</script>

<script>
    function mostrarGrupos(evt){

    document.getElementById("grupos").style.display = "block";
    document.getElementById("mensajesTab").style.display = "none";

    let botones = document.getElementsByClassName("tablinks");

    for(let i=0;i<botones.length;i++){
        botones[i].classList.remove("active");
    }

    evt.currentTarget.classList.add("active");

}


function mostrarMensajes(evt){

    document.getElementById("grupos").style.display = "none";
    document.getElementById("mensajesTab").style.display = "block";

    let botones = document.getElementsByClassName("tablinks");

    for(let i=0;i<botones.length;i++){
        botones[i].classList.remove("active");
    }

    evt.currentTarget.classList.add("active");

}
</script>
</body>
</html>
